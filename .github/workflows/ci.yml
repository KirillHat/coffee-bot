name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scanner
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets
      - name: Scan tracked source files
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          files = subprocess.check_output(
              ["git", "ls-files", "*.py", "*.toml", "*.yml", "*.yaml", "*.ini", "*.sh", "Dockerfile"],
              text=True,
          ).splitlines()
          if not files:
              print("No files to scan.")
              raise SystemExit(0)

          proc = subprocess.run(
              ["detect-secrets", "scan", *files],
              check=True,
              capture_output=True,
              text=True,
          )
          data = json.loads(proc.stdout)
          findings = data.get("results", {})
          if findings:
              print(json.dumps(findings, indent=2))
              raise SystemExit(1)
          print("detect-secrets: clean")
          PY

  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        env:
          BOT_TOKEN: "0:test"
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term -q

      - name: Upload coverage to Codecov
        if: matrix.python == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.7.4
      - name: Lint
        run: ruff check .

  smoke:
    name: runtime smoke
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Startup smoke with fake token
        run: |
          python - <<'PY'
          import os
          import subprocess

          env = os.environ.copy()
          env.update({
              "BOT_TOKEN": "0:test",
              "ADMIN_IDS": "1",
              "OWNER_CHAT_ID": "1",
              "DB_FILENAME": "ci_smoke.db",
              "CURRENCY": "USD",
          })
          proc = subprocess.run(
              ["python", "bot.py"],
              env=env,
              capture_output=True,
              text=True,
              timeout=20,
          )
          out = proc.stdout + proc.stderr
          if "Bot is starting" not in out:
              print(out)
              raise SystemExit("startup marker not found")
          if "Unauthorized: invalid token specified" not in out:
              print(out)
              raise SystemExit("expected fake-token auth failure not observed")
          print("Smoke OK")
          PY

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: roastline-coffee-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
