repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --exclude-files
          - '(^|/)(\\.env(\\..*)?|.*\\.md|screenshots/|assets/|coverage\\.xml|bot\\.log|bot\\.stdout\\.log)'
